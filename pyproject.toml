[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torcha"
description = "Bootstrap a team of Pi coding agents in Herdr workspaces"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Alberto Linares" }]
keywords = ["agents", "pi", "herdr", "orchestration", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/albestio/torcha"
Repository = "https://github.com/albestio/torcha"
Issues = "https://github.com/albestio/torcha/issues"
Changelog = "https://github.com/albestio/torcha/blob/main/CHANGELOG.md"

[project.scripts]
torcha = "torcha.cli:main"

[tool.hatch.version]
path = "src/torcha/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/torcha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
