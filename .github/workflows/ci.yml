name: tests

# The suite is hermetic: it runs against a fake `herdr-app`/`hc` inside the test
# file and never touches a real workspace, so CI needs neither Herdr nor Pi nor a
# terminal. If a test ever needs one of them, it must skip, not fail.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The packaging test builds a wheel with `uv`; without it the test skips and
      # the wheel contents go unchecked.
      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q
