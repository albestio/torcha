name: tests

# The suite is hermetic: it runs against a fake `herdr-app`/`hc` inside the test
# file and never touches a real workspace, so CI needs neither Herdr nor Pi nor a
# terminal. If a test ever needs one of them, it must skip, not fail.

on:
  push:
    branches: [master, main]
  pull_request:

# El workflow solo lee el repositorio: nada de escribir, publicar ni comentar.
permissions:
  contents: read

# Un push nuevo sobre la misma rama hace obsoleto el anterior: se cancela en vez
# de pagar dos veces el mismo resultado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # 3.14 es el intérprete del desarrollo local: si no está aquí, la versión
      # que de verdad se usa no la prueba nadie.
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The packaging test builds a wheel with `uv`; without it the test skips and
      # the wheel contents go unchecked.
      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: The installed command works
        # Ningún test ejecuta el script de consola: importa el paquete. Un entry
        # point roto —como el que el renombrado podía dejar— pasaría inadvertido.
        run: |
          torcha --help > /dev/null
          installed="$(torcha --version | awk '{print $2}')"
          expected="$(grep -oE '\"[0-9]+\.[0-9]+\.[0-9]+\"' src/torcha/__init__.py | tr -d '\"')"
          echo "script: $installed | source: $expected"
          test "$installed" = "$expected"

      - name: Test
        run: |
          # `pipefail` porque `tee` devuelve su propio estado: sin esto un pytest
          # en rojo pasaría por verde, que es exactamente el error que este
          # workflow debe impedir.
          set -o pipefail
          python -m pytest -q -rs | tee pytest.log

      - name: No test may be skipped
        run: |
          # Un test que se salta es una guarda que no corrió. El de empaquetado se
          # salta sin `uv`, y entonces nada comprueba que las skills viajen dentro
          # del paquete.
          if grep -qE "[0-9]+ skipped" pytest.log; then
            echo "::error::a test was skipped; a skip hides a guard that did not run"
            grep -E "skipped" pytest.log
            exit 1
          fi
          echo "no test was skipped"
